name: Sync Skills to docs-developers

# Runs on any skills/ change, not only on releases, which only happen when prompts/ changes.
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:

concurrency:
  group: sync-docs-developers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AI_DEPLOY_APP_ID }}
          private-key: ${{ secrets.AI_DEPLOY_PRIVATE_KEY }}
          owner: readmeio
          repositories: docs-developers

      - uses: actions/checkout@v7
        with:
          path: agent-plugins

      - uses: actions/checkout@v7
        with:
          repository: readmeio/docs-developers
          ref: v3.0
          token: ${{ steps.app-token.outputs.token }}
          path: docs-developers

      # --delete mirrors removals too, so docs-developers/skills/ always matches this repo exactly.
      - run: rsync -a --delete agent-plugins/skills/ docs-developers/skills/

      # Does nothing when skills/ is unchanged; otherwise opens the PR, or updates the open one.
      - uses: peter-evans/create-pull-request@v8
        with:
          path: docs-developers
          token: ${{ steps.app-token.outputs.token }}
          base: v3.0
          branch: agent-plugins/sync-skills
          delete-branch: true
          add-paths: skills
          commit-message: 'chore(skills): sync skills from agent-plugins ${{ github.sha }}'
          title: 'chore(skills): sync skills from agent-plugins'
          body: |
            Syncs `skills/` from [readmeio/agent-plugins@${{ github.sha }}](https://github.com/readmeio/agent-plugins/tree/${{ github.sha }}/skills).

            Generated by the [Sync Skills workflow](https://github.com/readmeio/agent-plugins/actions/runs/${{ github.run_id }}). Edit skills in `agent-plugins`, not here — changes made here are overwritten on the next sync.
          author: 'Deploy AI <1698517+ai-deploy-readme[bot]@users.noreply.github.com>'
          committer: 'Deploy AI <1698517+ai-deploy-readme[bot]@users.noreply.github.com>'
