name: Update Downstream Dependencies

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  update-dependencies:
    name: Update @readme/agent-plugins in ${{ matrix.repo }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # homepage has no packageManager field, so its pnpm version is set here.
          - repo: readmeio/homepage
            name: homepage
            pnpm_version: '11'

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.AI_DEPLOY_APP_ID }}
          private-key: ${{ secrets.AI_DEPLOY_PRIVATE_KEY }}
          owner: readmeio
          repositories: agent-plugins, ${{ matrix.name }}

      # pnpm_version needs the pnpm-aware release of this action.
      # https://github.com/readmeio/update-downstream-deps-action
      - uses: readmeio/update-downstream-deps-action@v1
        with:
          package_name: '@readme/agent-plugins'
          repository: ${{ matrix.repo }}
          github_token: ${{ steps.app-token.outputs.token }}
          npm_token: ${{ secrets.GITHUB_TOKEN }}
          pnpm_version: ${{ matrix.pnpm_version }}
          git_user_name: 'Deploy AI'
          git_user_email: '1698517+ai-deploy-readme[bot]@users.noreply.github.com'
